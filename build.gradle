plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://jitpack.io' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vic" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	def sherpaVersion = '2.0.1'
	def sherpaJvm = "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${sherpaVersion}"
	def sherpaNativeLibraries = [
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-x64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-aarch64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-x64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-aarch64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-arm64:${sherpaVersion}"
	]

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation sherpaJvm
	include sherpaJvm
	sherpaNativeLibraries.each { library ->
		implementation library
		include library
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
