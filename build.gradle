plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def getResolvedVersion() {
	if (project.hasProperty("mod_version") && project.property("mod_version")) {
		def ver = project.property("mod_version").toString().trim()
		return ver.startsWith("v") ? ver.substring(1) : ver
	}
	def envVersion = System.getenv("MOD_VERSION") ?: System.getenv("RELEASE_VERSION")
	if (envVersion && !envVersion.isBlank()) {
		def ver = envVersion.trim()
		return ver.startsWith("v") ? ver.substring(1) : ver
	}
	def refName = System.getenv("GITHUB_REF_NAME")
	if (refName && System.getenv("GITHUB_REF_TYPE") == "tag") {
		def ver = refName.trim()
		return ver.startsWith("v") ? ver.substring(1) : ver
	}
	return (project.findProperty("mod_version") ?: "1.0.0").toString()
}

version = getResolvedVersion()
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven { url = 'https://jitpack.io' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vic" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	def sherpaVersion = '2.0.1'
	def sherpaJvm = "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${sherpaVersion}"
	def sherpaNativeLibraries = [
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-x64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-aarch64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-x64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-aarch64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:${sherpaVersion}",
		"com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-arm64:${sherpaVersion}"
	]

	// To change the versions see the gradle.properties file
	// Minecraft & Fabric dependencies
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation sherpaJvm
	include sherpaJvm
	sherpaNativeLibraries.each { library ->
		implementation library
		include library
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.register("printVersion") {
	group = "versioning"
	description = "Prints the resolved Semantic Version of the mod."
	doLast {
		println "Project Version: ${project.version}"
	}
}

tasks.register("verifySemVer") {
	group = "verification"
	description = "Verifies that the project version adheres to Semantic Versioning (SemVer 2.0.0)."
	doLast {
		def semVerPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
		def ver = project.version.toString()
		if (!(ver ==~ semVerPattern)) {
			throw new GradleException("Version '${ver}' does not adhere to Semantic Versioning (SemVer 2.0.0: MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])")
		}
		logger.lifecycle("Version '${ver}' is valid Semantic Versioning (SemVer 2.0.0).")
	}
}

check.dependsOn(verifySemVer)
