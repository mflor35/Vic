name: Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version to release (e.g. 1.0.1, 1.1.0-beta.1, without "v" prefix)'
        required: true
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Mark release as draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Validate Semantic Version
        id: semver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi

          # Strip leading 'v' if present
          VERSION="${RAW_VERSION#v}"

          echo "Validating Semantic Version: ${VERSION}"

          # SemVer 2.0.0 official regex pattern
          SEMVER_REGEX="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$"

          if [[ ! "${VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::Version '${VERSION}' does not adhere to Semantic Versioning (SemVer 2.0.0: MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi

          # Determine pre-release flag
          IS_PRERELEASE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          elif [[ "${VERSION}" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          IS_DRAFT="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            IS_DRAFT="true"
          fi

          TAG_NAME="v${VERSION}"

          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_ENV
          echo "IS_DRAFT=${IS_DRAFT}" >> $GITHUB_ENV

          echo "Ready to release: ${TAG_NAME} (SemVer: ${VERSION}, Pre-release: ${IS_PRERELEASE}, Draft: ${IS_DRAFT})"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify and Build Release Jar
        run: |
          ./gradlew build -Pmod_version="${{ env.RELEASE_VERSION }}"
          ls -la build/libs/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Vic v${{ env.RELEASE_VERSION }} (Minecraft 26.x)"
          files: build/libs/*.jar
          generate_release_notes: true
          draft: ${{ env.IS_DRAFT == 'true' }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
